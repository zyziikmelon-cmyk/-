<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0c13">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>FIDORIUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=34">
</head>
<body>
<script>
window.addEventListener("error", function (e) {
  var f = (e.filename || "").split("/").pop();
  if (!f || document.getElementById("errbar")) return;
  var b = document.createElement("div"); b.id = "errbar";
  b.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99;background:#7a1c1c;color:#fff;padding:10px 16px;font:14px/1.4 system-ui,sans-serif";
  b.textContent = "Ошибка в файле " + f + ", строка " + e.lineno + ": " + e.message;
  document.body.appendChild(b);
});
</script>
<header class="top">
  <a class="logo" id="logo" href="#home"></a>
  <nav class="nav">
    <a href="#home" data-r="home" data-k="home"></a>
    <a href="#series" data-r="series" data-k="series"></a>
    <a href="#movies" data-r="movies" data-k="movies"></a>
    <a href="#favorites" data-r="favorites" data-k="favorites"></a>
    <a href="#fan" data-r="fan" data-k="fan"></a>
  </nav>
  <span class="sp"></span>
  <div class="sbox"><input class="q" id="q" type="text" autocomplete="off" enterkeyhint="search"><button class="qx" id="qx" type="button" aria-label="Clear" hidden>&times;</button><div class="sug" id="sug" hidden></div></div>
  <a class="icon" id="setBtn" href="#settings" data-r="settings" aria-label="Settings"></a>
  <button class="lang" id="lang" type="button" aria-label="Language">EN</button>
</header>
<main id="app"></main>
<footer class="foot" id="foot"></footer>
<div class="toast" id="toast"></div>
<div class="player" id="player" hidden>
  <video id="video" playsinline></video>
  <div class="p-top"><button class="icon" id="back" type="button" aria-label="Back">&#8592;</button><span id="pTitle"></span></div>
  <div class="spin" id="spin" hidden></div>
  <div class="empty" id="empty" hidden><div class="em-in"><b id="emTitle"></b><p id="emText"></p><small id="emCode"></small><button class="btn main" id="emRetry" type="button" hidden></button></div></div>
  <button class="skip" id="skip" type="button" hidden><i id="skFill"></i><span id="skTxt"></span></button>
  <div class="upnext" id="upnext" hidden>
    <div class="un-label" id="unLabel"></div>
    <div class="un-title" id="unTitle"></div>
    <div class="un-bar"><i id="unBar"></i></div>
    <div class="un-actions"><button class="btn main" id="unNow" type="button"></button><button class="btn" id="unCancel" type="button"></button></div>
  </div>
  <div class="author" id="author" hidden>
    <div class="a-src" id="aSrc"></div><div class="a-now" id="aNow"></div>
    <div class="a-btns"><button class="btn" id="aIs" type="button"></button><button class="btn" id="aIe" type="button"></button><button class="btn" id="aCs" type="button"></button></div>
    <input id="aOut" type="text" readonly><p id="aHint"></p>
    <div class="a-btns"><button class="btn main" id="aCopy" type="button"></button><button class="btn" id="aClose" type="button"></button></div>
  </div>
  <div class="ctrl" id="ctrl">
    <div class="seek" id="seek"><div class="buf" id="buf"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div><div class="tip" id="tip" hidden></div></div>
    <div class="row2">
      <button class="icon" id="pp" type="button" aria-label="Play"></button>
      <button class="pill" id="b10" type="button">&minus;10</button>
      <button class="pill" id="f10" type="button">+10</button>
      <button class="icon" id="mute" type="button" aria-label="Mute"></button>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <span class="time" id="time">0:00 / 0:00</span>
      <span class="sp"></span>
      <button class="pill" id="next" type="button"></button>
      <div class="qwrap"><button class="icon" id="gear" type="button" aria-label="Settings"></button><div class="menu" id="qmenu" hidden></div></div>
      <button class="icon" id="fs" type="button" aria-label="Fullscreen"></button>
    </div>
  </div>
</div>
<script>
(function(){
  if(!Element.prototype.replaceChildren){Element.prototype.replaceChildren=function(){while(this.firstChild)this.removeChild(this.firstChild);for(var i=0;i<arguments.length;i++){var n=arguments[i];this.appendChild(typeof n==="string"?document.createTextNode(n):n);}};}
  window.addEventListener("error",function(e){
    var a=document.getElementById("app");
    if(a&&!a.firstChild){var d=document.createElement("div");d.style.cssText="padding:40px 20px;color:#fff;font:16px sans-serif";d.textContent="Не удалось загрузить сайт. Обновите страницу или напишите автору: "+(e.message||"");a.appendChild(d);}
  });
})();
</script>
<script src="episodes.js?v=34"></script>
<script src="catalog.js?v=34"></script>
<script src="script.js?v=34"></script>
</body>
</html>
