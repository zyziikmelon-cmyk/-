<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Кинотеатр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="logo" id="logo"></div>
  <button class="lang" id="lang" type="button" aria-label="Language">EN</button>
</header>
<main>
  <section class="hero">
    <p class="kicker" id="kicker"></p>
    <h1 id="heroTitle"></h1>
    <p class="lead" id="heroText"></p>
    <div class="actions">
      <button class="btn main" id="continueBtn" type="button"></button>
      <button class="btn" id="trailerBtn" type="button"></button>
    </div>
  </section>
  <section class="episodes">
    <h2 id="seasonsHead"></h2>
    <div class="seasons" id="seasons"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<div class="player" id="player" hidden>
  <div class="p-top"><button class="back" id="back" type="button" aria-label="Back">&#8592;</button><span id="pTitle"></span></div>
  <div class="stage">
    <video id="video" controls playsinline></video>
    <div class="empty" id="empty" hidden></div>
  </div>
  <div class="p-bar">
    <button class="btn" id="next" type="button"></button>
    <label class="quality" id="qWrap"><span id="qLabel"></span> <select id="quality"></select></label>
  </div>
</div>
<script src="episodes.js"></script>
<script src="script.js"></script>
</body>
</html>
